services:
  qdrant-volume-init:
    image: qdrant/qdrant@sha256:12364fe851b9f17356fc88189fc06d1b521262e04659ec7345975b00c9246a10
    user: "0:0"
    entrypoint: [chown, "1000:1000", /qdrant/storage]
    network_mode: none
    read_only: true
    cap_drop: [ALL]
    cap_add: [CHOWN]
    security_opt: [no-new-privileges:true]
    mem_limit: 32m
    pids_limit: 16
    volumes: ["qdrant-data:/qdrant/storage"]
  qdrant:
    depends_on:
      qdrant-volume-init:
        condition: service_completed_successfully
    image: qdrant/qdrant@sha256:12364fe851b9f17356fc88189fc06d1b521262e04659ec7345975b00c9246a10
    user: "1000:1000"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    cpus: 1
    mem_limit: 512m
    pids_limit: 128
    volumes:
      - qdrant-data:/qdrant/storage
    tmpfs: ["/tmp:rw,nosuid,nodev,size=64m"]
    environment:
      QDRANT__TELEMETRY_DISABLED: "true"
      QDRANT__STORAGE__STORAGE_PATH: /qdrant/storage
      QDRANT__STORAGE__SNAPSHOTS_PATH: /qdrant/storage/snapshots
      QDRANT__STORAGE__TEMP_PATH: /tmp
    networks: [retrieval]
networks:
  retrieval:
    internal: true
    name: newagent-retrieval
volumes:
  qdrant-data:
    name: newagent-qdrant-data
